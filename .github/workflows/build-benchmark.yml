name: Build Genie TTS benchmark APK

on:
  push:
    branches: ["agent/**", main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genie-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Cache official Genie resources
        uses: actions/cache@v4
        with:
          path: tools/.cache/genie
          key: genie-v202-feibi-v2pp-${{ runner.os }}-v1
      - name: Install preparation tools
        run: pip install "genie-tts==2.0.2" "onnxruntime==1.22.1" "onnx<2"
      - name: Download official Genie resources
        run: python tools/prepare_benchmark_assets.py download
      - name: Precompute reference and text features
        run: python tools/prepare_benchmark_assets.py fixtures
      - name: Make Android-loadable ONNX models
        run: python tools/prepare_benchmark_assets.py models
      - name: Finalize benchmark manifest
        run: python tools/prepare_benchmark_assets.py finish
      - name: Smoke-test complete Genie inference
        run: python tools/prepare_benchmark_assets.py smoke
      - name: Show bundled sizes
        run: du -h app/src/main/assets/benchmark/models/* app/src/main/assets/benchmark
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Genie-TTS-Android-Benchmark-v0.1.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genie-TTS-Android-Benchmark-v0.1.1
          path: Genie-TTS-Android-Benchmark-v0.1.1.apk
          retention-days: 3
          compression-level: 6
