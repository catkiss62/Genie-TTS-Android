name: Temporary private Jiuhu APK relay

on:
  push:
    branches:
      - agent/v076-private-apk-relay

permissions:
  contents: write

jobs:
  relay-private-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download exact private v0.7.6 Jiuhu APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_ID='555859827'
          APK='Genie-TTS-Android-v0.7.6-Jiuhu-4-candidates-test.apk'
          EXPECTED_SIZE='649663221'
          EXPECTED_SHA256='af90aeaf84afdb383bd71584a5512609666c9af38110ea192ebde6f2c84ceb43'
          metadata="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}")"
          test "$(jq -r '.name' <<<"${metadata}")" = "${APK}"
          test "$(jq -r '.size' <<<"${metadata}")" = "${EXPECTED_SIZE}"
          test "$(jq -r '.digest' <<<"${metadata}")" = "sha256:${EXPECTED_SHA256}"
          gh api --method GET \
            -H 'Accept: application/octet-stream' \
            "/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            > "${APK}"
          test "$(stat -c '%s' "${APK}")" = "${EXPECTED_SIZE}"
          echo "${EXPECTED_SHA256}  ${APK}" | sha256sum -c -
          split --bytes=350000000 --numeric-suffixes=0 --suffix-length=1 \
            "${APK}" jiuhu-v076-apk.part-
          test "$(stat -c '%s' jiuhu-v076-apk.part-0)" = '350000000'
          test "$(stat -c '%s' jiuhu-v076-apk.part-1)" = '299663221'

      - name: Upload one-day private APK relay part 0
        uses: actions/upload-artifact@v4
        with:
          name: genie-v076-private-apk-relay-part-0
          path: jiuhu-v076-apk.part-0
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload one-day private APK relay part 1
        uses: actions/upload-artifact@v4
        with:
          name: genie-v076-private-apk-relay-part-1
          path: jiuhu-v076-apk.part-1
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
