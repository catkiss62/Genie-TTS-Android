name: Check Android source

on:
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "tools/*.py"
      - ".github/workflows/check-android-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile Android source without private model assets
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Run streaming segmenter unit tests
        run: gradle --no-daemon -PskipNativeBuild=true :app:testDebugUnitTest
      - name: Build thin APK for code verification
        run: gradle --no-daemon -PskipNativeBuild=true :app:assembleDebug
      - name: Upload thin verification APK
        uses: actions/upload-artifact@v4
        with:
          name: genie-tts-android-thin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Stage official Android APK signing tools
        shell: bash
        run: |
          tools_dir="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          test -x "$tools_dir/apksigner"
          test -f "$tools_dir/lib/apksigner.jar"
          test -x "$tools_dir/zipalign"
          mkdir -p build/apk-signing-tools/lib
          cp "$tools_dir/apksigner" build/apk-signing-tools/
          cp "$tools_dir/zipalign" build/apk-signing-tools/
          cp "$tools_dir/lib/apksigner.jar" build/apk-signing-tools/lib/
      - name: Upload official Android APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools-37
          path: build/apk-signing-tools
          if-no-files-found: error
          retention-days: 1
