name: Export public Genie build resources

on:
  pull_request:
    paths:
      - ".github/workflows/export-genie-reference-resources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install downloader
        run: pip install "huggingface_hub<2"
      - name: Download public reference resources
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          files = [
              "GenieData/G2P/ChineseG2P/opencpop-strict.txt",
              "GenieData/G2P/ChineseG2P/polyphonic.pickle",
              "GenieData/chinese-hubert-base/chinese-hubert-base.onnx",
              "GenieData/chinese-hubert-base/chinese-hubert-base_weights_fp16.bin",
          ]
          out = Path("public-genie-data")
          for name in files:
              source = Path(hf_hub_download(
                  repo_id="High-Logic/Genie",
                  repo_type="model",
                  filename=name,
                  local_dir=out,
              ))
              print(source, source.stat().st_size)
          PY
      - name: Upload public reference resources
        uses: actions/upload-artifact@v4
        with:
          name: public-genie-reference-resources
          path: public-genie-data/GenieData
          retention-days: 1
          compression-level: 0

  android-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: /home/runner/work/_temp/genie-gradle-user-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-disabled: true
      - name: Resolve Android build dependencies
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Collect Gradle, Android SDK and dependency cache
        shell: bash
        run: |
          set -eu
          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_root="$(dirname "$(dirname "$gradle_bin")")"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p public-toolchain/gradle public-toolchain/android-sdk/platforms public-toolchain/android-sdk/build-tools public-gradle-cache
          cp -a "$gradle_root"/. public-toolchain/gradle/
          cp -a "$ANDROID_HOME/platforms/android-35" public-toolchain/android-sdk/platforms/
          cp -a "$build_tools" public-toolchain/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/licenses" public-toolchain/android-sdk/
          cp -a "$GRADLE_USER_HOME"/. public-gradle-cache/
          du -sh public-toolchain/* public-gradle-cache
      - name: Upload public Android toolchain
        uses: actions/upload-artifact@v4
        with:
          name: public-android-toolchain
          path: public-toolchain
          retention-days: 1
          compression-level: 0
      - name: Upload resolved Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: public-gradle-dependency-cache
          path: public-gradle-cache
          retention-days: 1
          compression-level: 0
